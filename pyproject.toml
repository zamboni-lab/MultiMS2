[project]
name = "multims2"
version = "0.0.3"
description = "MultiMS2"
requires-python = "==3.12.*"
dependencies = [
  "altair-upset>=0.5.0",
  "c3p>=0.5.0", # required by chebifier
  "chebai>=1.1.0", # required by chebifier
  "chebai-graph>=1.0.0", # required by chebifier
  "chebifier>=1.2.1",
  "chemlog-extra>=1.0.1",
  "cmcrameri>=1.9",
  "datasketch>=1.9.0",
  "faerun>=0.4.7",
  "fastobo>=0.14.1", # required by chebifier
  "huggingface-hub>=1.8.0", # required by chebifier
  "jsonargparse[signatures]>=4.27.7", # required by chebifier, weird error with lightning
  "lightgbm>=4.6.0", # required by msbuddy
  "map4>=1.1.3",
  "marimo>=0.23.1",
  "matchms>=0.32.0",
  "matplotlib-colors>=1.0.16",
  "molzip>=0.9.2",
  "msbuddy>=0.3.14",
  "numpy>=2.2.6",
  "polars>=1.39.3",
  "pooch>=1.9.0",
  "pubchempy>=1.0.5",
  "pyarrow>=23.0.1",
  "rdkit>=2024.9.6", # because of the c3p dependency from chebifier
  "scipy>=1.15.3",
  "selfies>=2.2.0",
  "simple-parsing>=0.1.8",
  "tmap-silicon>=1.0.19",
  "tol-colors>=2.2.0",
  "torch>=2.11.0", # required by chebifier
  "torch-geometric>=2.7.0", # required by chebifier
  "torch-scatter>=2.1.2", # required by chebifier, needs `uv add torch-scatter --no-build-isolation`
  "tqdm>=4.67.3",
  "vegafusion>=2.0.3",
  "vl-convert-python>=1.9.0.post1",
]

[dependency-groups]
dev = [
  "prek>=0.3.9",
]

[tool.ty.rules]
unresolved-import = "ignore"

[tool.uv.sources]
msbuddy = { git = "https://github.com/adafede/msbuddy" }
tmap-silicon = { git = "https://github.com/afloresep/silicon-tmap-compatible" }
